<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akademac Centar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b1220, #050814);
      color: #e5e7eb;
    }

    header {
      padding: 100px 20px 60px;
      text-align: center;
    }

    header h1 {
      font-size: 52px;
      font-weight: 700;
    }

    header p {
      margin-top: 15px;
      color: #9ca3af;
      max-width: 650px;
      margin: auto;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 26px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    section {
      padding: 60px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* CHAT BUTTON */
    .chat-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      padding: 16px 22px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      z-index: 9999;
    }

    /* CHAT WINDOW */
    .chat-box {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      height: 420px;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
    }

    .chat-header {
      background: #1d4ed8;
      padding: 12px;
      font-weight: 700;
    }

    .chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      background: #111827;
      color: white;
    }

    .chat-input button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
    }

    .msg {
      margin: 5px 0;
    }

    .me { color: #60a5fa; }
    .bot { color: #a7f3d0; }
  </style>
</head>

<body>

<header>
  <h1>AKADEMAC CENTAR</h1>
  <p>Izrada seminarskih, maturskih i akademskih radova.</p>
  <div class="btn" onclick="toggleChat()">Kontaktirajte nas odmah</div>
</header>

<section>
  <div class="card">
    1. Pošaljete poruku<br>
    2. Dogovorimo detalje<br>
    3. Isporučujemo rad
  </div>
</section>

<footer style="text-align:center; padding:40px; color:#6b7280;">
  © 2026 Akademac Centar
</footer>

<!-- CHAT UI -->
<div class="chat-btn" onclick="toggleChat()">💬 Chat</div>

<div class="chat-box" id="chatBox">
  <div class="chat-header">Akademac podrška</div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">Zdravo! Kako možemo pomoći?</div>
  </div>

  <div class="chat-input">
    <input id="input" placeholder="Unesite poruku..." />
    <button onclick="sendMsg()">Pošalji</button>
  </div>
</div>

<script>
function toggleChat(){
  const box = document.getElementById("chatBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

function sendMsg(){
  const input = document.getElementById("input");
  const messages = document.getElementById("messages");

  if(input.value.trim() === "") return;

  const userMsg = document.createElement("div");
  userMsg.className = "msg me";
  userMsg.textContent = "Ti: " + input.value;
  messages.appendChild(userMsg);

  const botMsg = document.createElement("div");
  botMsg.className = "msg bot";
  botMsg.textContent = "Podrška: Javićemo vam se uskoro putem ovog chata.";
  messages.appendChild(botMsg);

  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
